# Checks every link in the README, docs and examples: relative paths and
# anchors always, external links with retries.
name: Links
on:
  pull_request:
    paths: ["**/*.md", "examples/**", ".github/workflows/links.yml", "lychee.toml"]
  push:
    branches: [main]
    paths: ["**/*.md", "examples/**", ".github/workflows/links.yml", "lychee.toml"]
  schedule:
    - cron: "17 6 * * 1" # weekly, to catch external links that rot
  workflow_dispatch:

permissions: {}

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --config lychee.toml
            --no-progress
            README.md CONTRIBUTING.md SECURITY.md 'docs/**/*.md' 'examples/**/*'
          fail: true
          jobSummary: true
