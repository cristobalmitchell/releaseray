# Recipe: keep each run's persona files and notes.json as an artifact.
# On public repositories internal personas are withheld from these files.
name: Release notes (with artifact)
on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: releaseray-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: notes
        uses: cristobalmitchell/releaseray@71e9da4f08b347c4031b1cc5d1a17f8d67dea36e # v1.1.0
        with:
          to: ${{ github.event.release.tag_name }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes-${{ steps.notes.outputs.key }}
          path: ${{ steps.notes.outputs.notes-dir }}
          retention-days: 30
