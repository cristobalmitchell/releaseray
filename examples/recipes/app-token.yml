# Recipe: act as a GitHub App you registered, for branches only the App may
# push to, or when the CHANGELOG commit must start other workflows.
#
# The push loop uses github-token for git as well, so passing the App token is
# enough. Pushes made with an App token do start workflows; ReleaseRay stops
# itself on its own commit (the Generated-by trailer).
#
# Commits are attributed to the App's bot user. Look up its id once:
#   gh api "/users/<app-slug>[bot]" --jq .id
# and set in .releaseray/config.yml:
#   outputs:
#     changelog:
#       author: { name: "<app-slug>[bot]", email: "<id>+<app-slug>[bot]@users.noreply.github.com" }
name: Release notes (GitHub App token)
on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: releaseray-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # the App token lasts one hour
    permissions:
      contents: read # the App token does the writing
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASERAY_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASERAY_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: cristobalmitchell/releaseray@v1 # pin to the full commit SHA of the release you use
        with:
          github-token: ${{ steps.app.outputs.token }}
          to: ${{ github.ref_name }}
          create-release: "true"
          push: "true"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
