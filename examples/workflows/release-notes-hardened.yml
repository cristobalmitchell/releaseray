# Flow 1H: the job with the LLM key cannot write, and the job that writes
# never sees the key. Recommended for public repositories that merge outside
# contributions.
name: Release notes (hardened)
on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: releaseray-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  generate: # holds the LLM key; read-only token
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      notes-digest: ${{ steps.gen.outputs.notes-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: gen
        uses: cristobalmitchell/releaseray@v1 # pin to the full commit SHA of the release you use
        with:
          mode: generate
          publish: "false" # generate only; the publish job writes
          to: ${{ github.event.release.tag_name }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: releaseray-notes-${{ steps.gen.outputs.notes-digest }}
          path: ${{ steps.gen.outputs.notes-dir }}
          retention-days: 1
          overwrite: true

  publish: # can write; never sees the LLM key
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # depth 1 is enough: publish reads no history
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: releaseray-notes-${{ needs.generate.outputs.notes-digest }}
          path: releaseray-notes
      - uses: cristobalmitchell/releaseray@v1 # pin to the full commit SHA of the release you use
        with:
          mode: publish
          notes-dir: releaseray-notes
          expected-digest: ${{ needs.generate.outputs.notes-digest }}
