# Diagnostics and migration on demand, with no LLM key. preview, doctor,
# validate-config and migrate-personas make no GitHub write, so their job has
# read permissions. adopt and sync-changelog write release markers and
# CHANGELOG entries, so they run in a separate job with contents: write.
name: ReleaseRay tools
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Mode to run
        type: choice
        options:
          - preview
          - doctor
          - validate-config
          - migrate-personas
          - adopt
          - sync-changelog
        default: preview
      to:
        description: "Tag (blank: HEAD for preview; use all_tags for adopt and sync-changelog)"
        type: string
        required: false
      preview_prompts:
        description: "preview: also write each persona's exact prompts"
        type: boolean
        default: false
      all_tags:
        description: "adopt and sync-changelog: every tag matching range.tagPattern"
        type: boolean
        default: false
      push:
        description: "adopt and sync-changelog: push the CHANGELOG edit"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: releaseray-tools-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  read-only:
    if: inputs.mode != 'adopt' && inputs.mode != 'sync-changelog'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: tools
        uses: cristobalmitchell/releaseray@71e9da4f08b347c4031b1cc5d1a17f8d67dea36e # v1.1.0
        with:
          mode: ${{ inputs.mode }}
          to: ${{ inputs.to || 'HEAD' }}
          preview-prompts: ${{ inputs.preview_prompts }}
          config: ${{ inputs.mode == 'migrate-personas' && '.releaseray/config.migrated.yml' || '.releaseray/config.yml' }}
      # migrate-personas writes the converted config to the runner's workspace;
      # upload it to copy into your repository.
      - if: inputs.mode == 'migrate-personas' || inputs.preview_prompts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: releaseray-tools-output
          path: |
            .releaseray/config.migrated.yml
            .releaseray/notes/
          if-no-files-found: ignore
          retention-days: 7

  migrate:
    if: inputs.mode == 'adopt' || inputs.mode == 'sync-changelog'
    runs-on: ubuntu-latest
    # adopt spaces bulk release writes 7.2 seconds apart and stops after 400, about 48 minutes.
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # CHANGELOG.md is read from, and pushed to, the default branch.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: cristobalmitchell/releaseray@71e9da4f08b347c4031b1cc5d1a17f8d67dea36e # v1.1.0
        with:
          mode: ${{ inputs.mode }}
          to: ${{ inputs.to }}
          all-tags: ${{ inputs.all_tags }}
          push: ${{ inputs.push }}
